# Chủ đề màu SafeWatch — sáng, phẳng. Màu chính (chàm) dùng cho nút / công tắc / thanh kéo — KHÔNG dùng đỏ, vì đỏ
# trong app nghĩa là KHẨN CẤP. Màu trạng thái (xanh lá / cam / đỏ / xám) định nghĩa trong theme.py.
[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
borderColor = "#E2E8F0"
baseRadius = "0.625rem"
font = "sans serif"

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#334155"
primaryColor = "#4F46E5"
borderColor = "#E2E8F0"
